{% extends "adminbase.html" %}

{% block title %}
Add Product | Loom & Lux Studio
{% endblock %}

{% block content %}
<div class="form-page">

    <!-- =======================================================================
    01. PAGE CONTENT HEADER
    ======================================================================== -->
    <div class="page-header">
        <div>
            <h1>Add Product</h1>
            <p>Add a new fabric product to your store</p>
        </div>
    </div>

    <!-- =======================================================================
    02. ADD PRODUCT CONSOLE FORM
    ======================================================================== -->
    <div class="box">
        <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="product_name" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category_id" required>
                    <option value="">Select Category</option>
                    {% for category in categories %}
                    <option value="{{ category.category_id }}">
                        {{ category.category_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Fabric Brand</label>
                <input type="text" name="fabric_brand" placeholder="Raymond, Arvind, Donear...">
            </div>

            <div class="form-group">
                <label>Fabric Type</label>
                <input type="text" name="fabric_type" placeholder="Cotton, Wool, Linen, Silk...">
            </div>

            <div class="form-group">
                <label>Color</label>
                <input type="text" name="color" placeholder="Blue, Black, Grey...">
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" step="0.01" name="price" required>
            </div>

            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" name="stock" value="0">
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="product_image" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select name="status">
                    <option value="Available">Available</option>
                    <option value="Out of Stock">Out of Stock</option>
                </select>
            </div>

            <div class="form-group">
                <label>New Arrival</label>
                <select name="is_new_arrival">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="save-btn">
                    Save Product
                </button>
                <button type="reset" class="cancel-btn">
                    Reset
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
